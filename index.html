<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 필기장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one app, three arrangements. PC/tablet: everything in the top bar, page thumbnails left, memo right.
   Phone: slim top bar, tool dock at the bottom, thumbnails and memo as sheets over the page. */
:root {
  --bg: #e7ebf0;
  --panel: #fbfcfd;
  --fg: #1b2330;
  --muted: #5b6676;
  --line: #d3d9e1;
  --accent: #2f5bd3;
  --accent-soft: #dfe7fb;
  --danger: #c62828;
  --memo: #fff4c2;
  --memo-fg: #3a3215;
  --memo-line: #e9d98a;
  --shadow: 0 1px 3px rgba(20, 30, 50, .18), 0 6px 18px rgba(20, 30, 50, .08);
  --ui: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --hand: "Gowun Dodum", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --panel: #1b2129; --fg: #e5e9ef; --muted: #98a2b1; --line: #2d3540;
    --accent: #86a2ff; --accent-soft: #263255; --danger: #ff7b7b; --memo: #2b2818; --memo-fg: #f1e6b8; --memo-line: #4a4426;
    --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1b2129; --fg: #e5e9ef; --muted: #98a2b1; --line: #2d3540;
  --accent: #86a2ff; --accent-soft: #263255; --danger: #ff7b7b; --memo: #2b2818; --memo-fg: #f1e6b8; --memo-line: #4a4426;
  --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--ui); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }

/* ---------- bars ---------- */
.bar, .dock {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); position: relative; z-index: 9;
}
.bar { border-bottom: 1px solid var(--line); }
.dock { border-top: 1px solid var(--line); flex-direction: column; align-items: stretch; gap: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
.dock-row { display: flex; align-items: center; justify-content: space-between; gap: 2px; }
.grp { display: flex; align-items: center; gap: 2px; }
.sep { width: 1px; height: 32px; background: var(--line); flex: none; }
.spacer { flex: 1; }
.tb {
  font: inherit; color: var(--fg); background: transparent; border: 0; border-radius: 10px;
  min-width: 48px; height: 48px; padding: 0 7px; display: inline-flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px; cursor: pointer; font-size: 11px; line-height: 1.1;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; position: relative; white-space: nowrap;
}
.tb svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tb:hover { background: var(--accent-soft); }
.tb[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.tb:disabled { opacity: .35; cursor: default; background: transparent; }
.tb.primary { background: var(--accent); color: var(--panel); flex-direction: row; gap: 6px; padding: 0 14px; font-size: 14px; font-weight: 500; height: 40px; }
.tb.ghost { flex-direction: row; gap: 6px; padding: 0 12px; font-size: 14px; height: 40px; border: 1px solid var(--line); }
.tb.primary svg, .tb.ghost svg { width: 18px; height: 18px; }
.tb.danger { color: var(--danger); }
.tb:focus-visible, .sw:focus-visible, .memo-item:focus-visible, .pill:focus-visible, .thumb:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.style-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.swatches { display: flex; gap: 6px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; touch-action: manipulation; flex: none; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.kinds { display: flex; gap: 2px; }
.kinds .tb { min-width: 40px; height: 40px; }
.width { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.width input { width: 96px; accent-color: var(--accent); }
.zoom-label { font-size: 13px; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.fname { font-size: 13px; color: var(--muted); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ---------- main area ---------- */
.main { flex: 1; min-height: 0; display: flex; position: relative; }
.viewer { flex: 1; min-width: 0; overflow: auto; position: relative; touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: contain; outline: none; }
.pages { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px 40px; box-sizing: border-box; width: max-content; min-width: 100%; }
.page { position: relative; background: #fff; box-shadow: var(--shadow); flex: none; }
.page canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.page .ink { z-index: 1; }
.hits { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.hit { position: absolute; background: rgba(255, 176, 0, .35); border-radius: 2px; }
.hit.cur { background: rgba(255, 110, 0, .45); outline: 2px solid #ff6a00; }
.pnum { position: absolute; left: 50%; bottom: -13px; transform: translate(-50%, 50%); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; z-index: 2; }
.memo-tab { position: absolute; top: 0; right: 14px; z-index: 3; width: 30px; height: 36px; border: 0; padding: 0; background: #ffd84d; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); cursor: pointer; touch-action: manipulation; }
.text-editor {
  position: absolute; z-index: 5; box-sizing: content-box; border: 1.5px dashed #2f5bd3; background: rgba(255, 255, 255, .85);
  padding: 0; margin: 0; resize: none; overflow: hidden; outline: none; white-space: pre; font-family: var(--ui); font-weight: 500;
  line-height: 1.35; user-select: text; -webkit-user-select: text; touch-action: auto; min-width: 40px;
}
.hud { position: absolute; left: 16px; bottom: 14px; z-index: 4; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); pointer-events: none; }

/* thumbnails */
.thumbs { width: 212px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; z-index: 7; }
.thumbs-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 4px 14px; font-size: 13px; color: var(--muted); }
.page-ops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 4px 8px 8px; border-bottom: 1px solid var(--line); }
.page-ops .tb { min-width: 0; height: 52px; font-size: 10.5px; }
.thumb-list { flex: 1; min-height: 0; overflow: auto; padding: 12px 18px 20px; display: grid; grid-template-columns: 1fr; gap: 14px; align-content: start; }
.thumb { font: inherit; background: transparent; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; position: relative; }
.thumb canvas { width: 100%; background: #fff; box-shadow: 0 0 0 1px var(--line); display: block; }
.thumb[aria-current="true"] canvas { box-shadow: 0 0 0 3px var(--accent); }
.thumb[aria-current="true"] { color: var(--accent); font-weight: 700; }
.thumb .dot { position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: #ffd84d; box-shadow: 0 0 0 2px var(--panel); }

/* memo */
.memo { width: 320px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; z-index: 7; }
.memo-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px 8px 16px; }
.memo-head h2 { font-size: 16px; font-weight: 700; margin: 0; flex: 1; font-variant-numeric: tabular-nums; text-align: center; }
.pill { font: inherit; font-size: 18px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; touch-action: manipulation; flex: none; }
.pill:disabled { opacity: .35; }
.note { margin: 0 12px; background: var(--memo); color: var(--memo-fg); border-radius: 4px 4px 4px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 150px; flex: 1.2; }
.note textarea {
  flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: inherit; box-sizing: border-box; min-height: 90px;
  font-family: var(--hand); font-size: 17px; line-height: 30px; padding: 6px 14px 14px;
  background-image: linear-gradient(transparent 29px, var(--memo-line) 29px, var(--memo-line) 30px);
  background-size: 100% 30px; background-attachment: local; background-position: 0 6px;
}
.note textarea::placeholder { color: var(--memo-fg); opacity: .5; }
.note-meta { font-size: 12px; padding: 4px 14px 8px; opacity: .7; display: flex; justify-content: space-between; }
.memo-list-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; font-size: 13px; color: var(--muted); }
.memo-list { flex: 1; min-height: 60px; overflow: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.memo-item { font: inherit; text-align: left; border: 0; background: transparent; color: var(--fg); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 44px 1fr; gap: 8px; cursor: pointer; align-items: baseline; }
.memo-item:hover, .memo-item[aria-current="true"] { background: var(--accent-soft); }
.memo-item b { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--accent); }
.memo-item span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.memo-empty { font-size: 13px; color: var(--muted); padding: 8px 10px; line-height: 1.6; }
.link { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 4px; }

/* search */
.searchbar { position: absolute; top: 10px; right: 16px; z-index: 8; display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 4px 4px 12px; box-shadow: var(--shadow); max-width: calc(100% - 32px); box-sizing: border-box; }
.searchbar input { font: inherit; font-size: 15px; border: 0; outline: 0; background: transparent; color: var(--fg); width: 200px; min-width: 0; flex: 1; }
.searchbar .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 52px; text-align: right; }
.searchbar .tb { min-width: 40px; height: 40px; }

/* popover */
.pop { position: absolute; top: 6px; right: 16px; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; width: 260px; max-width: calc(100% - 32px); box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
.pop h3 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .03em; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.opt { font: inherit; font-size: 13px; padding: 9px 4px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.pop .hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
.pop .row { font: inherit; font-size: 14px; text-align: left; padding: 10px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--fg); cursor: pointer; }
.pop .row:hover { background: var(--accent-soft); }

.drop { position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--accent-soft) 80%, transparent); display: grid; place-items: center; font-size: 18px; color: var(--accent); z-index: 20; pointer-events: none; }
.busy { position: absolute; inset: 0; display: grid; place-items: center; z-index: 30; background: color-mix(in srgb, var(--bg) 60%, transparent); }
.busy div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; box-shadow: var(--shadow); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); box-sizing: border-box; pointer-events: none; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* view modes */
.stage { flex: 1; min-width: 0; position: relative; display: flex; }
.row { display: flex; gap: 14px; align-items: flex-start; flex: none; }
.pages.paged { min-height: 100%; justify-content: center; padding-left: 64px; padding-right: 64px; }
.m-phone .pages.paged { padding-left: 16px; padding-right: 16px; }
.pages.tone-sepia .page canvas.pdf { filter: sepia(.5) saturate(1.1) brightness(.97); }
.pages.tone-night .page { background: #121212; }
.pages.tone-night .page canvas { filter: invert(.9) hue-rotate(180deg); }
.pager { position: absolute; top: 50%; transform: translateY(-50%); z-index: 6; width: 44px; height: 72px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--fg); border-radius: 12px; font: inherit; font-size: 26px; cursor: pointer; box-shadow: var(--shadow); touch-action: manipulation; }
#pagerPrev { left: 10px; } #pagerNext { right: 10px; }

/* sidebar tabs */
.side-tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); flex: none; }
.side-tab { font: inherit; font-size: 12.5px; padding: 11px 2px 9px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); cursor: pointer; touch-action: manipulation; }
.side-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.side-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.side-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.jump { display: flex; align-items: center; gap: 6px; padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); flex: none; }
.jump input { width: 56px; font: inherit; font-size: 14px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); text-align: center; font-variant-numeric: tabular-nums; }
.list { flex: 1; min-height: 0; overflow: auto; padding: 6px 6px 16px; display: flex; flex-direction: column; gap: 1px; }
.li { font: inherit; text-align: left; border: 0; background: transparent; color: var(--fg); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: baseline; cursor: pointer; font-size: 13.5px; line-height: 1.4; min-width: 0; }
.li:hover, .li[aria-current="true"] { background: var(--accent-soft); }
.li:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.li .k { color: var(--accent); font-weight: 700; font-size: 12.5px; flex: none; min-width: 3.4em; font-variant-numeric: tabular-nums; }
.li .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.li .pn { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.empty { font-size: 13px; color: var(--muted); padding: 12px; line-height: 1.6; }
.mark-bar { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.mark-bar .tb { width: 100%; justify-content: center; }
.seg.c2 { grid-template-columns: repeat(2, 1fr); }
.seg.c3 { grid-template-columns: repeat(3, 1fr); }
.pop { max-height: calc(100% - 12px); overflow: auto; }
.recent { display: flex; flex-direction: column; gap: 2px; }
.recent .li { padding: 7px 8px; }
input.sw.custom { -webkit-appearance: none; appearance: none; background: conic-gradient(#f43, #fc3, #3c6, #3cf, #36f, #c3f, #f43); }
input.sw.custom::-webkit-color-swatch-wrapper { padding: 5px; }
input.sw.custom::-webkit-color-swatch { border: 0; border-radius: 50%; }
input.sw.custom::-moz-color-swatch { border: 0; border-radius: 50%; }

/* ---------- tablet ---------- */
.m-tablet .thumbs { position: absolute; left: 0; top: 0; bottom: 0; box-shadow: var(--shadow); }
@media (max-width: 900px) {
  .m-tablet .memo, .m-pc .memo { position: absolute; left: 0; right: 0; bottom: 0; width: auto; height: 46%; border-left: 0; border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.12); }
  .m-tablet .memo-list-head, .m-tablet .memo-list { display: none; }
  .m-tablet .note { margin-bottom: 12px; }
  .m-tablet .fname { display: none; }
}

/* ---------- phone ---------- */
.m-phone .bar { flex-wrap: nowrap; gap: 4px; padding-block: 4px; }
.m-phone .bar .tb { min-width: 42px; height: 44px; padding: 0 4px; font-size: 10px; }
.m-phone .bar .tb.primary, .m-phone .bar .tb.ghost { padding: 0 10px; font-size: 13px; height: 38px; }
.m-phone .fname { flex: 1; max-width: none; }
.m-phone .dock-row.tools .grp { flex: 1; min-width: 0; }
.m-phone .dock-row.tools .tb { min-width: 0; flex: 1; height: 50px; padding: 0 2px; font-size: 10px; }
.m-phone .dock-row.opts { gap: 6px; }
.m-phone .dock-row.opts #gUndo .tb { min-width: 40px; height: 40px; font-size: 0; gap: 0; }
.m-phone .dock-row.opts #fingerBtn { min-width: 58px; height: 44px; font-size: 10px; }
.m-phone .dock-row.opts .style-row { flex: 1; min-width: 0; justify-content: center; gap: 6px 8px; }
.m-phone .sw { width: 26px; height: 26px; }
.m-phone .kinds .tb { min-width: 36px; height: 36px; }
.m-phone .width input { width: 64px; }
.m-phone .thumbs { position: absolute; inset: 0; width: auto; border-right: 0; }
.m-phone .thumb-list { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px 16px 20px; }
.m-phone .memo { position: absolute; left: 0; right: 0; bottom: 0; width: auto; height: 58%; border-left: 0; border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.14); border-radius: 16px 16px 0 0; }
.m-phone .memo-list { min-height: 0; }
.m-phone .searchbar { left: 8px; right: 8px; top: 8px; max-width: none; }
.m-phone .searchbar input { width: auto; }
.m-phone .hud { left: 12px; bottom: 10px; }
@media (max-width: 380px) { .m-phone .bar .tb span.lbl { display: none; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <header class="bar" id="bar"></header>
  <div class="main" id="main">
    <aside class="thumbs" id="thumbs" aria-label="사이드바" hidden>
      <div class="side-tabs" role="tablist">
        <button class="side-tab" role="tab" data-tab="pages">페이지</button>
        <button class="side-tab" role="tab" data-tab="outline">목차</button>
        <button class="side-tab" role="tab" data-tab="marks">북마크</button>
        <button class="side-tab" role="tab" data-tab="annots">주석</button>
      </div>
      <div class="jump">
        <label for="jumpIn">쪽 이동</label><input id="jumpIn" type="number" inputmode="numeric" min="1" enterkeyhint="go"><span id="jumpTotal">/ 0쪽</span>
        <span class="spacer"></span><button class="link" id="thumbsClose">닫기</button>
      </div>
      <div class="side-pane" data-pane="pages">
      <div class="page-ops">
        <button class="tb" id="opAdd" title="현재 페이지 뒤에 빈 페이지 추가"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10v7M8.5 13.5h7"/></svg>빈 페이지</button>
        <button class="tb" id="opRotate" title="현재 페이지를 오른쪽으로 90° 회전"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>회전</button>
        <button class="tb danger" id="opDelete" title="현재 페이지 삭제"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>삭제</button>
      </div>
      <div class="thumb-list" id="thumbList"></div>
      </div>
      <div class="side-pane" data-pane="outline" hidden><div class="list" id="outlineList"></div></div>
      <div class="side-pane" data-pane="marks" hidden>
        <div class="mark-bar"><button class="tb ghost" id="markBtn">☆ 현재 쪽 북마크</button></div>
        <div class="list" id="markList"></div>

<script src="lib/pdf-lib.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';

const PEN_COLORS = ['#1a1a1a', '#1f4fd1', '#d62828', '#1b8a4b'];
const PEN_NAMES = ['검정', '파랑', '빨강', '초록'];
const HL_COLORS = ['#ffd400', '#7ee05a', '#ff7eb6', '#5ec8ff'];
const HL_NAMES = ['노랑', '연두', '분홍', '하늘'];
const WIDTH = { pen: [0.5, 6, 0.1, '굵기'], hl: [6, 28, 1, '굵기'], shape: [0.5, 8, 0.1, '굵기'], text: [8, 40, 1, '크기'] };
const MIN_ZOOM = 0.25, MAX_ZOOM = 6, MAX_PIXELS = 16e6, HL_ALPHA = 0.38;
const TEXT_FONT = '"IBM Plex Sans KR", "Malgun Gothic", sans-serif', LH = 1.35;
const MODE_NAMES = { pc: 'PC', tablet: '태블릿', phone: '휴대폰' };

const viewer = $('#viewer'), pagesEl = $('#pages');
const zoomLabel = $('#zoomLabel');   // its group is detached in the phone layout
const PARTS = {};
for (const id of ['gFile', 'gTools', 'gStyle', 'gUndo', 'gZoom', 'fingerBtn', 'fname', 'gPanels']) PARTS[id] = document.getElementById(id);

// ---------- preferences (per device) ----------
const DEFAULT_PREFS = {
  mode: 'auto', tool: 'pen', shape: 'rect', fingerDraw: false, sideTab: 'pages',
  view: { flow: 'scroll', spread: 'single', fit: 'width', tone: 'normal' },
  custom: { pen: '#7a3cff', hl: '#ff9f1c', text: '#7a3cff', shape: '#7a3cff' },
  color: { pen: PEN_COLORS[0], hl: HL_COLORS[0], text: PEN_COLORS[0], shape: PEN_COLORS[2] },
  width: { pen: 1.6, hl: 12, text: 14, shape: 1.6 },
  panels: { pc: { memo: true, thumbs: true }, tablet: { memo: true, thumbs: false }, phone: { memo: false, thumbs: false } },
};
const prefs = (() => {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('pdfpilgi.prefs')) || {}; } catch (e) {}
  const p = JSON.parse(JSON.stringify(DEFAULT_PREFS));
  for (const k of ['mode', 'tool', 'shape', 'fingerDraw', 'sideTab']) if (k in saved) p[k] = saved[k];
  if ('penOnly' in saved && !('fingerDraw' in saved)) p.fingerDraw = !saved.penOnly;
  for (const k of ['color', 'width', 'view', 'custom']) Object.assign(p[k], saved[k] || {});
  for (const m in p.panels) Object.assign(p.panels[m], (saved.panels || {})[m] || {});
  if (!WIDTH[p.tool] && !['eraser', 'hand'].includes(p.tool)) p.tool = 'pen';
  return p;
})();
function savePrefs() { try { localStorage.setItem('pdfpilgi.prefs', JSON.stringify(prefs)); } catch (e) {} }

// ---------- IndexedDB (autosave on this device) ----------
const idb = (() => {
  let dbp;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('pdf-pilgi', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function req(mode, fn) {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const r = fn(db.transaction('kv', mode).objectStore('kv'));
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { return undefined; }
  }
  return { get: k => req('readonly', s => s.get(k)), set: (k, v) => req('readwrite', s => s.put(v, k)), del: k => req('readwrite', s => s.delete(k)) };
})();

// ---------- state ----------
const S = {
  pdf: null, bytes: null, name: '', key: '', pages: [], rows: [], rowIdx: 0, outlineP: null,
  ann: { pages: {}, memos: {} },
  zoom: 1, fit: true, cur: 1, memoPage: 1, mode: '',
  undo: [], redo: [],
};
const dpr = () => Math.min(window.devicePixelRatio || 1, 3);
const isDrawTool = t => t === 'pen' || t === 'hl' || t === 'text' || t === 'shape';
const listOf = n => S.ann.pages[n] || (S.ann.pages[n] = []);

let persistTimer = 0;
function persistSoon() {
  clearTimeout(persistTimer);
  $('#memoSaved').textContent = '';
  persistTimer = setTimeout(async () => {
    if (!S.key) return;
    await idb.set('ann:' + S.key, S.ann);
    $('#memoSaved').textContent = '이 기기에 저장됨';
  }, 500);
}

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2800);
}
function busy(text) { $('#busy').hidden = !text; if (text) $('#busyText').textContent = text; }

// ---------- screen versions: PC / tablet / phone ----------
function detectMode() {
  const coarse = matchMedia('(pointer: coarse)').matches;
  const short = Math.min(screen.width, screen.height);
  if (innerWidth < 600 || (coarse && short < 600)) return 'phone';
  if (coarse || navigator.maxTouchPoints > 1 && !matchMedia('(hover: hover)').matches) return 'tablet';
  return 'pc';
}
function currentMode() { return prefs.mode === 'auto' ? detectMode() : prefs.mode; }
function sep() { const s = document.createElement('span'); s.className = 'sep'; return s; }
function spacer() { const s = document.createElement('span'); s.className = 'spacer'; return s; }
function applyMode(force) {
  const m = currentMode();
  if (m === S.mode && !force) return;
  S.mode = m;
  document.body.className = 'm-' + m;
  const P = id => PARTS[id];
  const bar = $('#bar'), dock = $('#dock');
  if (m === 'phone') {
    bar.replaceChildren(P('gFile'), P('fname'), P('gPanels'));
    const opts = document.createElement('div'); opts.className = 'dock-row opts';
    opts.append(P('gUndo'), P('gStyle'), spacer(), P('fingerBtn'));
    const tools = document.createElement('div'); tools.className = 'dock-row tools';
    tools.append(P('gTools'));
    dock.replaceChildren(opts, tools);
    dock.hidden = false;
    P('gZoom').remove();
  } else {
    bar.replaceChildren(P('gFile'), sep(), P('gTools'), P('gStyle'), sep(), P('gUndo'), sep(), P('gZoom'), spacer(), P('fingerBtn'), P('fname'), P('gPanels'));
    dock.replaceChildren(); dock.hidden = true;
  }
  renderToolbar(); renderPanels(); renderModeMenu();
  if (S.fit) requestAnimationFrame(fitWidth);
}
function renderModeMenu() {
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === prefs.mode)));
  $('#modeHint').textContent = prefs.mode === 'auto'
    ? '이 기기를 ' + MODE_NAMES[S.mode] + '(으)로 알아봤어요. 링크 끝에 #pc, #tablet, #phone을 붙이면 그 버전으로 바로 열려요.'
    : MODE_NAMES[S.mode] + ' 버전으로 고정했어요. 자동을 누르면 기기에 맞춰 바뀌어요.';
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { prefs.mode = b.dataset.mode; savePrefs(); applyMode(); renderModeMenu(); });

// ---------- tool bar ----------
function renderToolbar() {
  const t = prefs.tool;
  document.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
  document.querySelectorAll('[data-kind]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === prefs.shape)));
  const styled = isDrawTool(t);
  $('#gStyle').hidden = !styled;
  $('#kinds').hidden = t !== 'shape';
  const sw = $('#swatches'); sw.replaceChildren();
  if (styled) {
    const list = t === 'hl' ? HL_COLORS : PEN_COLORS, names = t === 'hl' ? HL_NAMES : PEN_NAMES;
    const curColor = (t === 'text' && E) ? E.c : prefs.color[t];
    list.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', names[i]);
      b.setAttribute('aria-pressed', String(curColor === c));
      b.addEventListener('pointerdown', e => e.preventDefault());   // keep the text editor focused
      b.onclick = () => { prefs.color[t] = c; savePrefs(); if (t === 'text' && E) { E.c = c; styleEditor(); } renderToolbar(); };
      sw.appendChild(b);
    });
    const cc = document.createElement('input');
    cc.type = 'color'; cc.className = 'sw custom'; cc.title = '색 직접 고르기'; cc.setAttribute('aria-label', '색 직접 고르기');
    const own = !list.includes(curColor);
    cc.value = own ? curColor : prefs.custom[t];
    cc.setAttribute('aria-pressed', String(own));
    cc.oninput = () => {
      prefs.color[t] = prefs.custom[t] = cc.value; savePrefs();
      if (t === 'text' && E) { E.c = cc.value; styleEditor(); }
    };
    cc.onchange = renderToolbar;
    sw.appendChild(cc);
    const r = $('#wRange'), [mn, mx, st, label] = WIDTH[t];
    r.min = mn; r.max = mx; r.step = st; r.value = (t === 'text' && E) ? E.s : prefs.width[t];
    $('#wLabel').textContent = label;
  }
  $('#fingerBtn').setAttribute('aria-pressed', String(prefs.fingerDraw));
}
function setTool(t) {
  if (E && t !== 'text') commitEditor();
  prefs.tool = t; savePrefs(); renderToolbar();
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { prefs.shape = b.dataset.kind; savePrefs(); renderToolbar(); });
$('#wRange').addEventListener('pointerdown', e => { if (E) e.preventDefault(); });
$('#wRange').oninput = e => {
  const t = prefs.tool; prefs.width[t] = +e.target.value; savePrefs();
  if (t === 'text' && E) { E.s = +e.target.value; styleEditor(); }
};
$('#fingerBtn').onclick = () => {
  prefs.fingerDraw = !prefs.fingerDraw; savePrefs(); renderToolbar();
  toast(prefs.fingerDraw ? '손가락 하나로 쓰고, 두 손가락으로 넘기거나 확대해요.' : '손가락은 넘기기·확대용이에요. S펜이나 마우스로 써요.');
};

// ---------- panels ----------
function panels() { return prefs.panels[S.mode] || prefs.panels.pc; }
function renderPanels() {
  const P = panels();
  $('#memo').hidden = !P.memo; $('#thumbs').hidden = !P.thumbs;
  $('#memoBtn').setAttribute('aria-pressed', String(!!P.memo));
  $('#thumbsBtn').setAttribute('aria-pressed', String(!!P.thumbs));
  $('#thumbsClose').hidden = S.mode === 'pc';
  if (P.thumbs) renderSide();
}
function sideOpen(tab) { return !$('#thumbs').hidden && prefs.sideTab === tab; }
function renderSide() {
  const tab = prefs.sideTab;
  document.querySelectorAll('.side-tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  document.querySelectorAll('.side-pane').forEach(p => p.hidden = p.dataset.pane !== tab);
  if (tab === 'pages') { scheduleThumbs(); markThumb(); }
  else if (tab === 'outline') renderOutline();
  else if (tab === 'marks') renderMarks();

      out.push({ title: (it.title || '').trim() || '(제목 없음)', n, depth });

}

  if (S.pdf !== pdf) return;
  box.replaceChildren();
  if (!items.length) { emptyNote(box, '이 PDF에는 목차(책갈피)가 없어요. 북마크 탭에서 내가 자주 보는 쪽을 따로 모을 수 있어요.'); return; }

  const nums = Object.keys(S.ann.pages).map(Number).filter(n => (S.ann.pages[n] || []).length).sort((a, b) => a - b);
  if (!nums.length) { emptyNote(box, '아직 필기나 주석이 없어요. 펜·형광펜·텍스트·도형으로 표시하면 쪽별로 여기에 모여요.'); return; }

    const list = S.ann.pages[n], count = { pen: 0, hl: 0 }, shapes = {};

const textCache = new Map();

      ['읽기', '손가락 하나로 넘기고, 두 손가락으로 벌려 확대해요. PC에서는 Ctrl+휠로 확대해요. 확대가 끝나면 그 배율에 맞춰 다시 선명하게 그려요.'],
      ['필기', 'S펜이나 마우스로 바로 써요. 손가락은 기본으로 넘기기용이고, ‘손가락 필기’를 켜면 손가락 하나로 쓰고 두 손가락으로 넘겨요. 펜을 세게 누를수록 선이 굵어져요.'],
      ['텍스트·도형', '텍스트 도구로 페이지를 누르면 글상자가 생겨요. 이미 있는 글상자는 누르면 고치고, 끌면 옮겨져요. 도형은 사각형·원·직선·화살표 중에 골라 끌어서 그려요.'],
      ['지우기', '지우개로 문지르거나, S펜 옆 버튼을 누른 채 문지르면 그 선·도형·글상자가 통째로 지워져요.'],
      ['페이지', '‘페이지’에서 썸네일로 이동하고, 빈 페이지 추가·회전·삭제를 할 수 있어요. ‘찾기’로 문서 속 글자를 찾아요.'],
      ['메모', '노란 메모 칸은 페이지마다 따로 저장돼요. 메모가 있는 페이지에는 노란 책갈피가 붙어요.'],
      ['저장', '‘저장’을 누르면 필기·글상자·도형·메모가 들어간 새 PDF를 받아요. 메모는 다른 PDF 앱에서도 노트 주석으로 보여요.'],
    ];
    y += 10;
    for (const [h, t] of items) {
      g.fillStyle = '#e5e9f2'; g.fillRect(56, y - 4, 483, 1);
      g.fillStyle = '#111827'; g.font = '700 13px ' + F; g.fillText(h, 56, y + 20);
      g.fillStyle = '#374151'; g.font = '400 12px ' + F;
      y = wrap(g, t, 140, y + 20, 399, 20) + 12;
    }
    g.fillStyle = '#9ca3af'; g.font = '400 10px ' + F; g.fillText('PDF 필기장 · 1', 56, H - 40);
  });
  const p2 = await pageImage(g => {
    g.fillStyle = '#111827'; g.font = '700 20px ' + F; g.fillText('연습 페이지', 56, 80);
    g.fillStyle = '#6b7280'; g.font = '400 11.5px ' + F; g.fillText('자유롭게 써 보세요. 파란 물결과 빨간 표시, 글상자와 화살표는 예시예요.', 56, 104);
    g.strokeStyle = '#c9d8f0'; g.lineWidth = 0.8;
    for (let y = 150; y < H - 60; y += 28) { g.beginPath(); g.moveTo(40, y); g.lineTo(W - 40, y); g.stroke(); }
    g.strokeStyle = '#f2b8b8'; g.beginPath(); g.moveTo(80, 124); g.lineTo(80, H - 60); g.stroke();
    g.fillStyle = '#9ca3af'; g.font = '400 10px ' + F; g.fillText('PDF 필기장 · 2', 56, H - 40);
  });
  const doc = await PDFLib.PDFDocument.create();
  for (const buf of [p1, p2]) {
    const img = await doc.embedPng(buf);
    doc.addPage([W, H]).drawImage(img, { x: 0, y: 0, width: W, height: H });
  }
  doc.setTitle('PDF 필기장 사용 안내');
  const bytes = await doc.save();
  const hl = []; for (let x = 54; x <= 312; x += 6) hl.push(x, 104 + Math.sin(x / 40) * 0.6, 0.5);
  const wave = []; for (let x = 92; x <= 300; x += 3) wave.push(x, 183 + Math.sin(x / 9) * 5, 0.35 + 0.3 * Math.sin(x / 60));
  const check = [96, 236, 0.3, 102, 244, 0.45, 108, 252, 0.6, 118, 236, 0.6, 130, 218, 0.5, 140, 206, 0.35];
  const note = { t: 'text', x: 330, y: 226, c: '#1f4fd1', s: 14, text: '여기는 글상자예요\n눌러서 고칠 수 있어요' };
  Object.assign(note, measureText(note));
  const ann = {
    pages: {
      1: [{ t: 'hl', c: '#ffd400', w: 18, p: hl }],
      2: [{ t: 'pen', c: '#1f4fd1', w: 1.6, p: wave }, { t: 'pen', c: '#d62828', w: 2, p: check },
          note, { t: 'shape', k: 'arrow', c: '#d62828', w: 1.6, a: [322, 236, 156, 228] },
          { t: 'shape', k: 'rect', c: '#1b8a4b', w: 1.4, a: [88, 296, 300, 352] }],
    },
    memos: { 1: '예시 메모예요.\n이 칸에 쓴 내용은 1쪽에만 붙어요. 다른 페이지로 넘기면 그 페이지의 메모가 보여요.' },
  };
  return { bytes, ann };
}
async function openSample() {
  busy('예시 문서를 준비하는 중…');
  try {
    const { bytes, ann } = await makeSample();
    await openFile(bytes, '사용 안내 (예시).pdf', { key: 'sample-v2', ann });
  } catch (e) { console.error(e); busy(''); toast('예시 문서를 만들지 못했어요. ‘PDF 열기’로 파일을 열어 주세요.'); }
}
$('#showGuide').onclick = () => { $('#pop').hidden = true; openSample(); };

// ---------- start ----------
(() => {
  const h = (location.hash || '').slice(1).toLowerCase();
  if (MODE_NAMES[h]) { prefs.mode = h; savePrefs(); }
})();
applyMode(true);
applyView();
showMemo();

// installable app: only when served from its own site, never inside the Claude viewer
const standalone = !(window.claude && window.claude.use) && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
if (standalone) {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  const m = document.createElement('meta'); m.name = 'theme-color'; m.content = '#2f5bd3'; document.head.appendChild(m);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
// PDF opened from the PC file explorer ("연결 프로그램") in the installed app
if (standalone && 'launchQueue' in window) {
  window.launchQueue.setConsumer(async params => {
    const h = params.files && params.files[0]; if (!h) return;
    const f = await h.getFile();
    openFile(new Uint8Array(await f.arrayBuffer()), f.name, { remember: true });
  });
}

(async () => {
  try { await document.fonts.load('500 16px "IBM Plex Sans KR"'); } catch (e) {}
  // PDF shared to the installed app from another Android app ("공유 → PDF 필기장")
  if (/[?&]shared=1/.test(location.search)) {
    const sh = await idb.get('shared');
    history.replaceState(null, '', location.pathname + location.hash);
    if (sh && sh.bytes) { await idb.del('shared'); await openFile(new Uint8Array(sh.bytes), sh.name || '공유된 문서.pdf', { remember: true }); if (S.pdf) return; }
  }
  const rec = (await idb.get('recent')) || [];
  if (rec.length) {
    const buf = await idb.get('file:' + rec[0].key);
    if (buf) { await openFile(new Uint8Array(buf), rec[0].name, { key: rec[0].key }); if (S.pdf) return; }
  }
  const last = await idb.get('last');
  if (last && last.bytes) { await openFile(new Uint8Array(last.bytes), last.name, { key: last.key, remember: true }); if (S.pdf) return; }
  openSample();
})();
})();
</script>
